apply plugin: 'com.android.application'

android {
    namespace "com.xtt.mcmodmaker"
    compileSdk 35

    defaultConfig {
        applicationId "com.xtt.mcmodmaker"
        minSdkVersion 23
        targetSdkVersion 26
        versionCode 4
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            // 仅 CI 注入签名信息；密钥库和密码绝不进入仓库。
            def keyStorePath = System.getenv("NEMO_KEYSTORE_FILE")
            if (keyStorePath != null && !keyStorePath.trim().isEmpty()) {
                storeFile file(keyStorePath)
                storePassword System.getenv("NEMO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NEMO_KEY_ALIAS")
                keyPassword System.getenv("NEMO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 没有 CI 发布密钥时不允许悄悄使用 debug 签名构建 release。
            if (System.getenv("NEMO_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        // 本机快测用：照 release 编译（AOT 正常），只关 R8/资源压缩，包名加后缀区分。
        fast {
            initWith(buildTypes.release)
            applicationIdSuffix ".fast"
            versionNameSuffix "-fast"
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    // 兼容 Java 8 语法（lambda 等）
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    // 不上架 Play，targetSdk 保持 26 以免改变存储/权限行为；
    // 随之而来的 lint「targetSdk 过期」提示与构建无关，直接关掉。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation files('libs/ore-ui.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // 权限相关（ActivityCompat / ContextCompat）
    implementation 'androidx.core:core:1.15.0'
    // SAF 树目录访问（DocumentFile）
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // Kotlin 标准库（ore-ui 依赖 Kotlin 类）
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    // sora-editor 开源代码编辑器
    implementation 'io.github.Rosemoe.sora-editor:editor:0.20.4'
}

// sora-editor 会带进 1.6.x 的 kotlin-stdlib-jdk7/jdk8，与 1.8 的 kotlin-stdlib 类重复。
// Kotlin 1.8 起这两个包已并入 kotlin-stdlib，统一到同一版本即可消除重复类。
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

